[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "codecons"
version = "0.1.0"
description = "Do quantized code LLMs stay consistent under semantics-preserving prompt changes?"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
gpu = [
    "torch>=2.1",
    "transformers>=4.45",
    "accelerate>=0.33",
    "bitsandbytes>=0.43",
    "datasets>=2.18",
]
dev = ["pytest>=7.4"]

[tool.setuptools]
packages = ["codecons"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
